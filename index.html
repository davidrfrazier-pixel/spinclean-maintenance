function parseCSVLine(line){
  const result=[];
  let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'&&line[i+1]==='"'){cur+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{cur+=ch;}
    } else {
      if(ch==='"'){inQ=true;}
      else if(ch===','){result.push(cur.trim());cur='';}
      else{cur+=ch;}
    }
  }
  result.push(cur.trim());
  return result;
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return[];
  const headers=parseCSVLine(lines[0]).map(h=>h.replace(/^"|"$/g,'').toLowerCase().replace(/ /g,'_'));
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const vals=parseCSVLine(lines[i]);
    const row={};
    headers.forEach((h,j)=>{row[h]=(vals[j]||'').replace(/^"|"$/g,'').trim();});
    const errors=[];
    CSV_REQUIRED.forEach(col=>{if(!row[col]) errors.push(col+' is required');});
    if(row.type&&!['Washer','Dryer','Combo','Other'].includes(row.type)) errors.push('type must be Washer, Dryer, Combo, or Other');
    if(row.status&&!['ok','maintenance','error'].includes(row.status)) errors.push('status must be ok, maintenance, or error');
    if(row.manufactured_year&&isNaN(parseInt(row.manufactured_year))) errors.push('manufactured_year must be a number');
    if(row.install_year&&isNaN(parseInt(row.install_year))) errors.push('install_year must be a number');
    row._valid=errors.length===0;
    row._errors=errors;
    rows.push(row);
  }
  return rows;
}

function csvDragOver(e){e.preventDefault();document.getElementById('csv-drop').classList.add('drag-over');}
function csvDragLeave(){document.getElementById('csv-drop').classList.remove('drag-over');}
function csvDrop(e){e.preventDefault();document.getElementById('csv-drop').classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f)readCsvFile(f);}
function csvFileSelected(e){const f=e.target.files[0];if(f)readCsvFile(f);}
function readCsvFile(file){
  const reader=new FileReader();
  reader.onload=ev=>{state.csvRows=parseCSV(ev.target.result);state.csvDone=false;state.csvResults=null;render();};
  reader.readAsText(file);
}

async function importCsv(){
  const locId=(document.getElementById('csv-loc')||{}).value;
  if(!locId){alert('Please select a location first.');return;}
  const okRows=state.csvRows.filter(r=>r._valid);
  if(okRows.length===0) return;
  state.csvUploading=true;render();
  const recs=okRows.map(r=>({
    location_id:locId,machine_id:r.machine_id.toUpperCase(),type:r.type?r.type.charAt(0).toUpperCase()+r.type.slice(1).toLowerCase():'Washer',model:r.model,
    serial_number:r.serial_number||null,
    manufactured_year:r.manufactured_year?parseInt(r.manufactured_year):null,
    install_year:r.install_year?parseInt(r.install_year):null,
    software_version:r.software_version||null,status:['ok','maintenance','error'].includes(r.status)?r.status:'ok',
    brand:r.brand||null,group_name:r.group_name||null,capacity:r.capacity||null,vendor:r.vendor||null,
    purchase_price:r.purchase_price?parseFloat(r.purchase_price):null,
    last_service_date:r.last_service_date||null,notes:r.notes||null,
    flagged:false,issue_count:0,
  }));
  let inserted=0,failed=0;
  for(let i=0;i<recs.length;i+=50){
    const batch=recs.slice(i,i+50);
    const{data,error}=await insertMachines(batch);
    if(error){failed+=batch.length;}else{inserted+=data?.length||batch.length;}
  }
  delete state.allMachines[locId];
  if(locId===state.activeLocId){const ms=await loadMachines(locId);state.allMachines[locId]=ms||[];}
  state.csvUploading=false;state.csvDone=true;state.csvResults={inserted,failed};render();
}

function resetCsv(){state.csvRows=[];state.csvDone=false;state.csvResults=null;render();}

function downloadTemplate(){
  const header=CSV_COLS.join(',')+'\n';
  const example='A-01,Washer,Front Washers,Speed Queen,TR7000WN,SN123456,3.5 cu ft,2020,2021,4.1.0,ok,ABC Supply,1200.00,2025-01-15,No issues\n';
  const blob=new Blob([header+example],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='machines_template.csv';a.click();URL.revokeObjectURL(url);
}

async function submitAddMachine() {
  const f = getAddFormValues();
  const errs = {};
  if(!f.location_id) errs.location='Select a location';
  if(!f.machine_id) errs.machine_id='Machine ID is required';
  if(!f.model) errs.model='Select a model';
  if(f.model==='Other'&&!f.model_custom) errs.model_custom='Enter the model name';
  // serial_number is optional
  if(!f.manufactured_year) errs.manufactured_year='Select year';
  if(!f.install_year) errs.install_year='Select year';
  if(f.manufactured_year&&f.install_year&&parseInt(f.install_year)<parseInt(f.manufactured_year)) errs.install_year='Cannot be before manufactured year';
  if(!f.software_version) errs.software_version='Enter version';

  if(Object.keys(errs).length>0){ state.addMachineErrors=errs; render(); return; }

  const rec = {
    location_id: f.location_id,
    machine_id: f.machine_id,
    type: f.type,
    model: f.model==='Other'?f.model_custom:f.model,
    serial_number: f.serial_number||null,
    manufactured_year: f.manufactured_year?parseInt(f.manufactured_year):null,
    install_year: f.install_year?parseInt(f.install_year):null,
    software_version: f.software_version,
    brand: f.brand,
    group_name: f.group_name,
    capacity: f.capacity,
    warranty_expiry: f.warranty_expiry||null,
    last_service_date: f.last_service_date||null,
    purchase_price: f.purchase_price?parseFloat(f.purchase_price):null,
    vendor: f.vendor,
    status: f.status,
    flagged: false,
    issue_count: 0,
    notes: f.notes,
  };

  // Save to Supabase
  const btn = document.querySelector('.form-actions .btn.primary');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  const {data,error} = await insertMachine(rec);
  if(error){
    state.addMachineErrors={_server:'Database error: '+error.message};
    render(); return;
  }
  // Refresh machines list for this location
  delete state.allMachines[f.location_id];
  if(f.location_id===state.activeLocId){
    const ms = await loadMachines(f.location_id);
    state.allMachines[f.location_id]=ms||[];
  }
  state.addMachineSuccess=data;
  state.addMachineErrors={};
  render();
}

function renderLocations() {

    const ms = state.allMachines[loc.id] || [];

          <button class="loc-view-btn" onclick="goLocFromCard('${loc.id}')">View machines ${ICONS.ico16}</button>

  }).join('');

  const emptyState = locs.length === 0 ? `
    <div class="empty-dashed" style="margin-bottom:20px;">

  return `

async function saveLocation() {
  const f = getLocFormValues();
  let valid = true;

  // Validate required fields
  const nameErr = document.getElementById('lf-name-err');
  const addrErr = document.getElementById('lf-address-err');
  const cityErr = document.getElementById('lf-city-err');
  const formErr = document.getElementById('loc-form-error');

  if(!f.name) {
    nameErr.textContent = 'Location name is required'; nameErr.style.display='block'; valid=false;
  } else { nameErr.style.display='none'; }

  if(!f.address) {
    addrErr.textContent = 'Street address is required'; addrErr.style.display='block'; valid=false;
  } else { addrErr.style.display='none'; }

  if(!f.city) {
    cityErr.textContent = 'City is required'; cityErr.style.display='block'; valid=false;
  } else { cityErr.style.display='none'; }

  if(!valid) return;

  const saveBtn = document.getElementById('loc-save-btn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  formErr.style.display = 'none';

  if(state.editingLocId) {
    const {data, error} = await updateLocation(state.editingLocId, f);
    if(error) {
      formErr.textContent = 'Error saving: ' + error.message;
      formErr.style.display = 'block';
      saveBtn.disabled=false; saveBtn.textContent='Save location'; return;
    }
    const idx = state.locations.findIndex(l=>l.id===state.editingLocId);
    if(idx>=0) state.locations[idx] = {...state.locations[idx], ...f};
  } else {
    const {data, error} = await insertLocation(f);
    if(error) {
      formErr.textContent = 'Error saving: ' + error.message;
      formErr.style.display = 'block';
      saveBtn.disabled=false; saveBtn.textContent='Save location'; return;
    }
    if(data) {
      state.locations.push(data);
      state.allMachines[data.id] = [];
    }
  }

  saveBtn.disabled = false;
  saveBtn.textContent = 'Save location';
  closeLocModal();
  render();
}

async function deleteLocation() {
  const locId = state.editingLocId;
  if(!locId) return;
  const loc = state.locations.find(l=>l.id===locId);
  if(!confirm(`Remove "${loc?.name||'this location'}"? Machines assigned to it will remain in the database.`)) return;

  const error = await deleteLocationDB(locId);
  if(error) { alert('Error removing location: '+error.message); return; }
  state.locations = state.locations.filter(l=>l.id!==locId);
  delete state.allMachines[locId];
  if(state.activeLocId===locId) {
    state.activeLocId = state.locations[0]?.id||null;
    if(state.activeLocId) await switchLocation(state.activeLocId, false);
  }
  closeLocModal();
  render();
}

async function handleProfileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  state.profileUploading = true;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const dataUrl = ev.target.result;
    const { error } = await db.from('users').update({ avatar_url: dataUrl }).eq('id', state.user.id);
    if (!error) {
      state.user.avatar_url = dataUrl;
      const emp = state.employees.find(e => e.id === state.user.id);
      if (emp) emp.avatar_url = dataUrl;
    }
    state.profileUploading = false;
    showProfile();
    render();
  };
  reader.readAsDataURL(file);
}

// ─── Maintenance Checklist ──────────────────────────────────────────────────
function getMaintTasksForMachine(machineId) {
  const ms = getMachines();
  const m = ms.find(x => x.id === machineId);
  if (!m) return [];
  const d = daysSince(m.last_service_date);
  const age = m.install_year ? currentYear() - m.install_year : 0;
  const tasks = [];
  if (m.flagged || m.status === 'error') {
    tasks.push({id:`t1-${machineId}`,title:'Inspect machine & identify issue',required:true});
    tasks.push({id:`t2-${machineId}`,title:'Document error code or symptom',required:true,photo:true});
    tasks.push({id:`t3-${machineId}`,title:'Attempt repair or reset',required:false});
    tasks.push({id:`t4-${machineId}`,title:'Run test cycle to verify fix',required:false});
    tasks.push({id:`t5-${machineId}`,title:'Update machine status & log entry',required:true});
  } else if (d > 90) {
    tasks.push({id:`t1-${machineId}`,title:'Visual inspection — exterior & door seal',required:true});
    tasks.push({id:`t2-${machineId}`,title:'Clean lint trap & filters',required:true,photo:true});
    tasks.push({id:`t3-${machineId}`,title:'Clean drum interior',required:true});
    tasks.push({id:`t4-${machineId}`,title:'Inspect hoses & connections',required:true});
    tasks.push({id:`t5-${machineId}`,title:'Lubricate moving parts',required:false});
    tasks.push({id:`t6-${machineId}`,title:'Run test cycle',required:true});
    tasks.push({id:`t7-${machineId}`,title:'Log completed maintenance',required:true});
  } else if (age >= 8) {
    tasks.push({id:`t1-${machineId}`,title:'Check drum bearings for wear',required:true});
    tasks.push({id:`t2-${machineId}`,title:'Inspect door seals & gaskets',required:true,photo:true});
    tasks.push({id:`t3-${machineId}`,title:'Check control panel & display',required:true});
    tasks.push({id:`t4-${machineId}`,title:'Inspect water inlet valves',required:false});
    tasks.push({id:`t5-${machineId}`,title:'Log inspection findings',required:true});
  } else {
    tasks.push({id:`t1-${machineId}`,title:'General inspection & cleaning',required:true});
    tasks.push({id:`t2-${machineId}`,title:'Log service entry',required:true});
  }
  return tasks;
}

function renderChecklist() {
  const role = state.user?.role;
  if (role === 'attendant') return renderAttendantChecklist();
  // Maintenance team — machine-by-machine
  const ms = getMachines();
  const needsAttention = ms.filter(m =>
    m.flagged || m.status === 'error' ||
    daysSince(m.last_service_date) > 60 ||
    (m.install_year && currentYear() - m.install_year >= 8)
  );
  if (needsAttention.length === 0) return `
    <div class="page-header"><div class="page-title">Maintenance Checklist</div></div>
    <div class="empty-state">
      <div class="empty-icon">${ICONS.checkSquare}</div>
      <div class="empty-title">All machines in good shape</div>
      <div class="empty-sub">No machines need attention at this location today.</div>
    </div>`;

  const allTasks = needsAttention.flatMap(m => getMaintTasksForMachine(m.id));
  const doneCount = allTasks.filter(t => state.maintTaskCompletions[t.id]).length;
  const pct = allTasks.length === 0 ? 100 : Math.round(doneCount / allTasks.length * 100);

  return `
    <div class="page-header">
      <div class="page-title">Maintenance Checklist</div>
      <div class="page-sub">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <div style="font-size:11px;color:var(--text2);">${doneCount} of ${allTasks.length} tasks · ${needsAttention.length} machine${needsAttention.length!==1?'s':''}</div>
      <div style="font-size:12px;font-weight:600;color:${pct===100?'var(--green)':'var(--text2)'};">${pct}%</div>
    </div>
    <div class="todo-progress-bar" style="background:var(--bg);margin-bottom:16px;">
      <div class="todo-fill" style="width:${pct}%;background:var(--green);"></div>
    </div>
    ${needsAttention.map(m => {
      const tasks = getMaintTasksForMachine(m.id);
      const machineDone = tasks.filter(t => state.maintTaskCompletions[t.id]).length;
      const isExpanded = state.maintExpanded[m.id] !== false;
      const d = daysSince(m.last_service_date);
      const age = m.install_year ? currentYear() - m.install_year : 0;
      const reason = m.flagged ? ICONS.flag+' Flagged' : m.status==='error' ? ICONS.alertTri+' Error' : d>90 ? d+'d since service' : age>=8 ? age+'yr old' : 'Due';
      return `<div class="maint-machine-section">
        <div class="maint-machine-header" onclick="toggleMaintExpanded('${m.id}')">
          <div>
            <div class="maint-machine-id">${m.machine_id} <span style="font-size:11px;background:rgba(255,255,255,0.15);padding:2px 8px;border-radius:10px;font-weight:500;">${reason}</span></div>
            <div class="maint-machine-model">${m.brand?m.brand+' · ':''}${m.model}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="font-size:12px;color:rgba(255,255,255,0.75);">${machineDone}/${tasks.length}</div>
            <div style="font-size:14px;opacity:.6;">${isExpanded?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:inline-block;vertical-align:middle;"><polyline points="18,15 12,9 6,15"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:inline-block;vertical-align:middle;"><polyline points="6,9 12,15 18,9"/></svg>'}</div>
          </div>
        </div>
        ${isExpanded ? `
          ${tasks.map(t => {
            const isDone = !!state.maintTaskCompletions[t.id];
            return `<div class="maint-task-item ${isDone?'done':''}">
              <div class="todo-check ${isDone?'checked':t.required?'urgent':''}" onclick="toggleMaintTask('${t.id}')"></div>
              <div style="flex:1;">
                <div class="maint-task-title">${t.title}</div>
                ${t.required ? '<div class="maint-task-meta" style="color:var(--red-text);">Required</div>' : ''}
                ${t.photo ? '<div class="maint-task-meta">' + ICONS.camera + ' Photo recommended</div>' : ''}
              </div>
            </div>`;
          }).join('')}
          <div style="padding:12px 16px;border-top:1px solid var(--border);">
            <textarea class="maint-notes-input" placeholder="Notes for ${m.machine_id}..." rows="2"
              id="maint-notes-${m.id}" onchange="state.maintNotes['${m.id}']=this.value">${state.maintNotes[m.id]||''}</textarea>
            <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
              <button class="maint-log-btn" onclick="logMaintEntry('${m.id}')">${ICONS.clipboard} Log service entry</button>
              <button class="maint-log-btn" style="background:var(--blue);" onclick="selectMachine('${m.id}')">View machine ${ICONS.ico16}</button>
            </div>
          </div>
        ` : ''}
      </div>`;
    }).join('')}`;
}

function renderAttendantChecklist() {
  const tasks = state.checklists;
  const done = tasks.filter(t => state.checkCompletions[t.id]?.completed).length;
  const total = tasks.length;
  const pct = total === 0 ? 100 : Math.round(done / total * 100);
  const cats = [...new Set(tasks.map(t => t.category || 'General'))];
  return `
    <div class="page-header"><div class="page-title">Shift Checklist</div></div>
    <div style="background:var(--navy);border-radius:var(--radius-lg);padding:16px;color:#fff;margin-bottom:16px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:2px;">Today's tasks</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.65);">${done} of ${total} completed</div>
      <div class="todo-progress-bar" style="margin-top:10px;background:rgba(255,255,255,0.2);">
        <div class="todo-fill" style="width:${pct}%;background:#34D399;"></div>
      </div>
    </div>
    ${total === 0 ? `<div class="empty-dashed">No tasks set up for this location yet.</div>` :
      cats.map(cat => {
        const catTasks = tasks.filter(t => (t.category || 'General') === cat);
        return `<div style="margin-bottom:16px;">
          <div class="section-title">${cat}</div>
          ${catTasks.map(t => {
            const isDone = !!state.checkCompletions[t.id]?.completed;
            return `<div class="maint-task-item ${isDone?'done':''}">
              <div class="todo-check ${isDone?'checked':''}" onclick="toggleCheckItem('${t.id}')"></div>
              <div style="flex:1;">
                <div class="maint-task-title">${t.task_name}</div>
                ${t.photo_required ? '<div class="maint-task-meta" style="color:var(--amber-text);">' + ICONS.camera + ' Photo required</div>' : ''}
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}`;
}

function toggleMaintExpanded(id) { state.maintExpanded[id] = state.maintExpanded[id] === false ? true : false; render(); }
function toggleMaintTask(taskId) { state.maintTaskCompletions[taskId] = !state.maintTaskCompletions[taskId]; render(); }
function toggleCheckItem(id) { if (!state.checkCompletions[id]) state.checkCompletions[id] = {}; state.checkCompletions[id].completed = !state.checkCompletions[id].completed; render(); }

async function logMaintEntry(machineId) {
  const m = getMachine(machineId);
  if (!m) return;
  const notes = state.maintNotes[machineId] || '';
  const tasks = getMaintTasksForMachine(machineId);
  const completed = tasks.filter(t => state.maintTaskCompletions[t.id]).map(t => t.title);
  const title = `Maintenance checklist — ${m.machine_id} (${completed.length}/${tasks.length} tasks)`;
  const { error } = await db.from('maintenance_log').insert([{
    machine_id: machineId, location_id: state.activeLocId, entry_type: 'routine',
    title, notes: notes || null, technician: state.user.name, service_date: today()
  }]);
  if (error) { alert('Error: ' + error.message); return; }
  await db.from('machines').update({ last_service_date: today(), status: 'ok', updated_at: new Date().toISOString() }).eq('id', machineId);
  m.last_service_date = today(); m.status = 'ok';
  state.log = await loadLog(state.activeLocId);
  alert('Service entry logged for ' + m.machine_id);
  render();
}


// ─── Supply actions ────────────────────────────────────────────────────────
function setSupplyUrgency(u) {
  state.supplyUrgency = u;
  document.querySelectorAll('.urgency-chip').forEach(el => {
    el.classList.toggle('selected', el.textContent.trim().toLowerCase() === u);
  });
}

async function submitSupplyRequest() {
  const name = document.getElementById('supply-name')?.value?.trim();
  const notes = document.getElementById('supply-notes')?.value?.trim();
  if (!name) { alert('Please enter a supply name.'); return; }
  try {
    const { data, error } = await db.from('supply_requests').insert([{
      location_id: state.activeLocId, user_id: state.user.id,
      supply_name: name, urgency: state.supplyUrgency,
      notes: notes || null, status: 'open'
    }]).select();
    if (error) { alert('Could not submit request: ' + error.message); return; }
    state.supplyRequests = await dbGetSupplyRequests(state.activeLocId);
    state.supplyUrgency = 'low';
    render();
    // Brief success feedback
    const btn = document.querySelector('.supply-form .btn');
    if (btn) { btn.textContent = 'Submitted!'; btn.style.background = 'var(--green)'; setTimeout(() => { btn.textContent = 'Submit request'; btn.style.background = ''; }, 2000); }
  } catch(e) {
    console.error('Supply submit error:', e);
    alert('Could not submit request. Check your connection and try again.');
  }
}

async function updateSupplyStatus(id, status) {
  await db.from('supply_requests').update({
    status, resolved_by: state.user.id,
    resolved_at: status === 'resolved' ? new Date().toISOString() : null
  }).eq('id', id);
  state.supplyRequests = await dbGetSupplyRequests(state.activeLocId);
  render();
}


// ─── Missing helper functions ──────────────────────────────────────────────

function getAlerts(machines) {
  const a = [];
  machines.forEach(m => {
    const d = daysSince(m.last_service_date);
    if (m.flagged) a.push({type:'danger', text:`Machine ${m.machine_id} flagged: ${m.issue_count||0} recurring issues`, sub:m.model, mid:m.id});
    else if (m.status==='error') a.push({type:'danger', text:`Machine ${m.machine_id} reporting an error`, sub:m.model, mid:m.id});
    else if (d>120) a.push({type:'warn', text:`Machine ${m.machine_id} overdue for maintenance (${d}d)`, sub:m.model, mid:m.id});
    else if (d>90) a.push({type:'info', text:`Machine ${m.machine_id} approaching service interval (${d}d)`, sub:m.model, mid:m.id});
  });
  return a.slice(0, 8);
}

function buildTodos(machines) {
  const items = [];
  machines.forEach(m => {
    const d = daysSince(m.last_service_date);
    const age = m.install_year ? currentYear() - m.install_year : 0;
    if (m.flagged) items.push({key:`flag-${m.id}`, mid:m.id, priority:'critical', task:'Flagged machine — inspect & assess', detail:`${m.issue_count||0} recurring issues`, meta:m.type+' · '+m.model});
    if (m.status==='error' && !m.flagged) items.push({key:`err-${m.id}`, mid:m.id, priority:'critical', task:'Error reported — diagnose & repair', detail:'Machine reporting active error', meta:m.type+' · '+m.model});
    if (d>120 && !m.flagged && m.status!=='error') items.push({key:`over-${m.id}`, mid:m.id, priority:'high', task:'Overdue maintenance', detail:`${d} days since last service`, meta:m.type+' · '+m.model});
    else if (d>90 && !m.flagged && m.status!=='error') items.push({key:`due-${m.id}`, mid:m.id, priority:'high', task:'Routine maintenance due', detail:`${d} days since last service`, meta:m.type+' · '+m.model});
    if (age>=8 && d>60 && !m.flagged) items.push({key:`age-${m.id}`, mid:m.id, priority:'routine', task:'Aged machine check', detail:`Machine is ${age} years old`, meta:m.type+' · '+m.model});
  });
  const seen = new Set();
  return items.filter(it => { const k=it.mid+it.priority; if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b) => ({critical:0,high:1,routine:2}[a.priority] - {critical:0,high:1,routine:2}[b.priority]));
}

async function deleteLocationDB(id) {
  const { error } = await db.from('locations').delete().eq('id', id);
  return error;
}

async function insertLocation(rec) {
  const { data, error } = await db.from('locations').insert([rec]).select().single();
  return { data, error };
}

async function updateLocation(id, rec) {
  const { data, error } = await db.from('locations').update(rec).eq('id', id).select().single();
  return { data, error };
}

async function switchLocation(locId, doRender=true) {
  state.activeLocId = locId;
  state.selectedMachineId = null;
  state.dashFilter = null;
  state.messageChanLocId = locId;
  const wd = getWeekDates(state.weekOffset);
  // Parallelize independent DB queries for faster location switching
  const needMachines = !state.allMachines[locId];
  const [machines, log, messages, supplies, checklists, shifts] = await Promise.all([
    needMachines ? loadMachines(locId) : Promise.resolve(state.allMachines[locId]),
    loadLog(locId),
    dbGetMessages(locId),
    dbGetSupplyRequests(locId),
    dbGetChecklistTemplates(locId),
    dbGetShifts(locId, wd[0], wd[6]),
  ]);
  if (needMachines) state.allMachines[locId] = machines || [];
  state.log = log;
  state.messages = messages;
  state.supplyRequests = supplies;
  state.checklists = checklists;
  state.shifts = shifts;
  if (doRender) render();
}

let _resizeTimer;
window.addEventListener('resize', () => { clearTimeout(_resizeTimer); _resizeTimer = setTimeout(() => { if (state.user) render(); }, 200); });
init();
</script>
